# This workflow builds, verifies, and creates an installer for the Modrix WPF application
# It creates a standalone executable and uses Inno Setup to create an installer

name: Build and Create Installer

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-package:
    runs-on: windows-latest
    
    env:
      Solution_Name: Modrix.sln
      Project_Name: Modrix.csproj
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Add MSBuild to the PATH
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # Restore and build the application
    - name: Restore dependencies
      run: dotnet restore $env:Solution_Name

    - name: Build application (Debug)
      run: dotnet build $env:Project_Name --configuration Debug --no-restore

    - name: Build application (Release)
      run: dotnet build $env:Project_Name --configuration Release --no-restore

    # Verify the build by running basic checks
    - name: Debug build output structure
      run: |
        Write-Host "=== Checking build output structure ==="
        if (Test-Path "bin") {
          Get-ChildItem -Path "bin" -Recurse -Filter "*.exe" | ForEach-Object { 
            Write-Host "Found executable: $($_.FullName)"
          }
          Get-ChildItem -Path "bin" -Recurse | Where-Object { $_.PSIsContainer } | ForEach-Object {
            Write-Host "Directory: $($_.FullName)"
          }
        } else {
          Write-Host "No bin directory found"
        }

    - name: Verify build output
      run: |
        # Check multiple possible locations for the executable
        $possiblePaths = @(
          "bin\Release\net8.0-windows\Modrix.exe",
          "bin\Release\net8.0-windows\win-x64\Modrix.exe"
        )
        
        $found = $false
        foreach ($path in $possiblePaths) {
          if (Test-Path $path) {
            Write-Host "✓ Release build successful - executable found at: $path"
            Get-ChildItem (Split-Path $path) | Select-Object Name, Length
            $found = $true
            break
          }
        }
        
        if (-not $found) {
          Write-Error "✗ Release build failed - executable not found in any expected location"
          Write-Host "Expected locations checked:"
          foreach ($path in $possiblePaths) {
            Write-Host "  - $path"
          }
          exit 1
        }

    # Create standalone executable in exe directory
    - name: Create exe directory
      run: New-Item -ItemType Directory -Force -Path "exe"

    - name: Publish standalone executable
      run: |
        dotnet publish $env:Project_Name `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          --output "exe" `
          --property:PublishSingleFile=true `
          --verbosity normal

    - name: Verify standalone executable
      run: |
        if (Test-Path "exe\Modrix.exe") {
          Write-Host "✓ Standalone executable created successfully"
          $fileInfo = Get-Item "exe\Modrix.exe"
          Write-Host "Executable size: $($fileInfo.Length) bytes"
          Get-ChildItem "exe\" | Select-Object Name, Length | Format-Table -AutoSize
        } else {
          Write-Error "✗ Standalone executable creation failed"
          exit 1
        }

    # Install Inno Setup
    - name: Install Inno Setup
      run: |
        $url = "https://files.jrsoftware.org/is/6/innosetup-6.2.2.exe"
        $output = "innosetup.exe"
        Write-Host "Downloading Inno Setup..."
        Invoke-WebRequest -Uri $url -OutFile $output
        Write-Host "Installing Inno Setup..."
        Start-Process -FilePath $output -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
        Write-Host "Inno Setup installed successfully"

    # Create installer directory
    - name: Create installer directory
      run: New-Item -ItemType Directory -Force -Path "installer"

    # Create installer using Inno Setup
    - name: Create installer with Inno Setup
      run: |
        $innoSetupPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (Test-Path $innoSetupPath) {
          Write-Host "Creating installer using Inno Setup..."
          & $innoSetupPath "Modrix.iss"
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✓ Installer created successfully"
          } else {
            Write-Error "✗ Installer creation failed with exit code $LASTEXITCODE"
            exit 1
          }
        } else {
          Write-Error "✗ Inno Setup compiler not found at $innoSetupPath"
          exit 1
        }

    # Verify installer was created
    - name: Verify installer creation
      run: |
        $installerPath = "installer\ModrixSetup.exe"
        if (Test-Path $installerPath) {
          $fileInfo = Get-Item $installerPath
          Write-Host "✓ Installer created: $installerPath"
          Write-Host "Installer size: $($fileInfo.Length) bytes"
        } else {
          Write-Error "✗ Installer file not found at $installerPath"
          Get-ChildItem "installer\" -ErrorAction SilentlyContinue | Format-Table -AutoSize
          exit 1
        }

    # Install NSIS for beautiful custom installer
    - name: Install NSIS
      run: |
        Write-Host "Installing NSIS via Chocolatey (most reliable method)..."
        try {
          # Use chocolatey as primary method since it's more reliable
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          
          # Install chocolatey if not present
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Chocolatey..."
            iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
          }
          
          Write-Host "Installing NSIS via Chocolatey..."
          choco install nsis -y --no-progress
          Write-Host "NSIS installed successfully via Chocolatey"
          
        } catch {
          Write-Host "Chocolatey installation failed: $($_.Exception.Message)"
          Write-Host "Trying direct download as fallback..."
          
          # Fallback to direct download
          $url = "https://sourceforge.net/projects/nsis/files/NSIS%203/3.10/nsis-3.10-setup.exe"
          $output = "nsis-setup.exe"
          
          Invoke-WebRequest -Uri $url -OutFile $output -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -MaximumRedirection 5 -TimeoutSec 300
          
          # Verify the file was downloaded and is valid
          if (-not (Test-Path $output) -or (Get-Item $output).Length -lt 1MB) {
            throw "Downloaded file is invalid or too small"
          }
          
          Write-Host "NSIS downloaded successfully. File size: $((Get-Item $output).Length) bytes"
          Write-Host "Installing NSIS..."
          Start-Process -FilePath $output -ArgumentList "/S" -Wait -ErrorAction Stop
          Write-Host "NSIS installed successfully via direct download"
        }

    # Create NSIS installer directory
    - name: Create NSIS installer directory
      run: New-Item -ItemType Directory -Force -Path "nsis-installer"

    # Create NSIS installer with custom GUI
    - name: Create NSIS installer with custom GUI
      run: |
        # Try multiple possible NSIS installation paths
        $nsisPaths = @(
          "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
          "${env:ProgramFiles}\NSIS\makensis.exe",
          "${env:ChocolateyInstall}\lib\nsis\tools\makensis.exe",
          "C:\ProgramData\chocolatey\lib\nsis\tools\makensis.exe"
        )
        
        $nsisPath = $null
        foreach ($path in $nsisPaths) {
          if (Test-Path $path) {
            $nsisPath = $path
            Write-Host "Found NSIS at: $nsisPath"
            break
          }
        }
        
        if ($nsisPath) {
          Write-Host "Creating NSIS installer with custom GUI..."
          & $nsisPath "Modrix.nsi"
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✓ NSIS installer created successfully"
          } else {
            Write-Error "✗ NSIS installer creation failed with exit code $LASTEXITCODE"
            exit 1
          }
        } else {
          Write-Host "Checking PATH for makensis..."
          try {
            & makensis "Modrix.nsi"
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✓ NSIS installer created successfully using PATH"
            } else {
              throw "makensis failed with exit code $LASTEXITCODE"
            }
          } catch {
            Write-Error "✗ NSIS compiler not found in any expected location or PATH"
            Write-Host "Searched locations:"
            foreach ($path in $nsisPaths) {
              Write-Host "  - $path"
            }
            exit 1
          }
        }

    # Verify NSIS installer was created
    - name: Verify NSIS installer creation
      run: |
        $nsisInstallerPath = "nsis-installer\ModrixSetup-NSIS.exe"
        if (Test-Path $nsisInstallerPath) {
          $fileInfo = Get-Item $nsisInstallerPath
          Write-Host "✓ NSIS installer created: $nsisInstallerPath"
          Write-Host "NSIS installer size: $($fileInfo.Length) bytes"
        } else {
          Write-Error "✗ NSIS installer file not found at $nsisInstallerPath"
          Get-ChildItem "nsis-installer\" -ErrorAction SilentlyContinue | Format-Table -AutoSize
          exit 1
        }

    # Upload standalone executable artifacts
    - name: Upload standalone executable
      uses: actions/upload-artifact@v4
      with:
        name: Modrix-Standalone-Executable
        path: exe/

    # Upload installer artifact
    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: Modrix-Installer
        path: installer/ModrixSetup.exe

    # Upload NSIS installer artifact
    - name: Upload NSIS installer
      uses: actions/upload-artifact@v4
      with:
        name: Modrix-NSIS-Installer
        path: nsis-installer/ModrixSetup-NSIS.exe
