name: Build and Package Modrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout source
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Install .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3️⃣ Restore NuGet packages
      - name: Restore
        run: dotnet restore Modrix.sln

      # 4️⃣ Build in Release
      - name: Build
        run: dotnet build Modrix.sln --configuration Release --no-restore

      # 5️⃣ Publish self-contained exe
      - name: Publish
        run: dotnet publish Modrix.sln -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      # 6️⃣ Setup Inno Setup compiler
      - name: Setup Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.1.0
        with:
          path: 'Modrix.iss'

      # 7️⃣ Uploading the exe and installer as artifacts
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Modrix-build
          path: |
            publish/*
            Output/*.exe  # אם הסקריפט של Inno Setup מוציא ל-Output
